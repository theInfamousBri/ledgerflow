services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ledgerflow}
      POSTGRES_USER: ${POSTGRES_USER:-ledgerflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow-local}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ledgerflow} -d ${POSTGRES_DB:-ledgerflow}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.9.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:9093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  transaction-api:
    build:
      context: .
      args: { MODULE: transaction-api }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ledgerflow}
      DB_USERNAME: ${POSTGRES_USER:-ledgerflow}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-ledgerflow-local}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_started }

  payment-provider-simulator:
    build:
      context: .
      args: { MODULE: payment-provider-simulator }
    environment:
      PROVIDER_FAILURE_RATE: ${PROVIDER_FAILURE_RATE:-0.0}
      PROVIDER_LATENCY_MS: ${PROVIDER_LATENCY_MS:-100}
    ports:
      - "8082:8082"

  transaction-processor:
    build:
      context: .
      args: { MODULE: transaction-processor }
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PROVIDER_BASE_URL: http://payment-provider-simulator:8082
    ports:
      - "8081:8081"
    depends_on:
      kafka: { condition: service_started }
      payment-provider-simulator: { condition: service_started }

volumes:
  postgres-data:


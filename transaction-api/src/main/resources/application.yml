server:
  port: 8080
spring:
  application:
    name: transaction-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ledgerflow}
    username: ${DB_USERNAME:ledgerflow}
    password: ${DB_PASSWORD:ledgerflow-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
  mvc:
    problemdetails:
      enabled: true
ledgerflow:
  outbox:
    publish-delay-ms: ${OUTBOX_PUBLISH_DELAY_MS:500}
    retention: ${OUTBOX_RETENTION:7d}
    cleanup-batch-size: ${OUTBOX_CLEANUP_BATCH_SIZE:1000}
    cleanup-delay: ${OUTBOX_CLEANUP_DELAY:1h}
    cleanup-initial-delay: ${OUTBOX_CLEANUP_INITIAL_DELAY:1m}
    metrics-refresh-delay: ${OUTBOX_METRICS_REFRESH_DELAY:15s}
    metrics-initial-delay: ${OUTBOX_METRICS_INITIAL_DELAY:5s}
  reconciliation:
    stale-after: ${RECONCILIATION_STALE_AFTER:2m}
    retry-delay: ${RECONCILIATION_RETRY_DELAY:5m}
    batch-size: ${RECONCILIATION_BATCH_SIZE:100}
    scan-delay: ${RECONCILIATION_SCAN_DELAY:30s}
    initial-delay: ${RECONCILIATION_INITIAL_DELAY:30s}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

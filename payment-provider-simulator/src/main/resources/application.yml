server:
  port: 8082
spring:
  application:
    name: payment-provider-simulator
provider:
  failure-rate: ${PROVIDER_FAILURE_RATE:0.0}
  latency-ms: ${PROVIDER_LATENCY_MS:100}
management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
  include-application-name: false
